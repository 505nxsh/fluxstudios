const st=document.createElement('style');st.textContent=CSS;document.head.append(st);
document.body.insertAdjacentHTML('afterbegin',BODY);
const STYLES="Y2K,Minimalist,Brutalist,Neo-Brutalist,Swiss / International,Bauhaus,Art Deco,Art Nouveau,Vaporwave,Retro / Vintage,Retro-Futurism,Cyberpunk,Futurism,Memphis,Psychedelic,Grunge,Maximalist,Flat,Skeuomorphic,Glassmorphism,Neumorphism,Gradient,Acid Graphics,Pop Art,Constructivist,Dada,Surrealist,Modernist,Postmodern,Abstract,Geometric,Isometric,Low Poly,Pixel Art,Line Art,Hand-Drawn,Collage,Duotone,Gothic,Steampunk,Cottagecore,Kawaii,Anime / Manga,Cartoon,Vector,3D / CGI,Photo Manipulation,Mixed Media,Typographic,Organic / Botanical".split(",");
const FORMATS="Logo & Branding,Poster,Packaging,Editorial / Magazine,Album Cover,Social Media,UI / UX,Web Design,Infographic,Merch / Apparel,Signage,Motion Graphics,Illustration,Photo Edit,Other".split(",");
const ALL=[...STYLES,...FORMATS];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tOpen=false,works=[],filter="all",files=[],CAN=false,A=null,dirty=false;
works=(SEED||[]).sort((a,b)=>b.ts-a.ts);

/* storage: IndexedDB (falls back to memory) */
const DB={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open("flux-studios",1);q.onupgradeneeded=()=>q.result.createObjectStore("w",{keyPath:"id"});q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 all(){return new Promise(r=>{if(!this.db)return r([]);try{const q=this.db.transaction("w").objectStore("w").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})},
 put(o){try{this.db&&this.db.transaction("w","readwrite").objectStore("w").put(o)}catch(e){}},
 del(id){try{this.db&&this.db.transaction("w","readwrite").objectStore("w").put({id,del:1})}catch(e){}}};

function shrink(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/webp",.85))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}

function render(){
  const used=ALL.filter(c=>works.some(w=>w.cat===c));
  $("sW").textContent=works.length;$("sT").textContent=used.length;$("sA").textContent=ALL.length;
  const cnt=c=>works.filter(w=>w.cat===c).length;
  const chip=c=>`<button class="chip ${filter===c?"on":""}${cnt(c)?"":" nil"}" data-f="${esc(c)}">${esc(c)} (${cnt(c)})</button>`;
  $("bar").innerHTML=`<button class="chip ${filter==="all"?"on":""}" data-f="all" aria-expanded="${tOpen}">All (${works.length}) ${tOpen?"▴":"▾"}</button>`+used.map(chip).join("");
  $("types").hidden=!tOpen;
  $("types").innerHTML=`<div class="dim">All ${ALL.length} design types — choose one to filter the gallery</div>`+[["Styles",STYLES],["Formats",FORMATS]].map(([t,l])=>`<div class="tgrp"><span class="dim">${t} — ${l.length}</span><div class="tchips">${l.map(chip).join("")}</div></div>`).join("");
  const show=filter==="all"?used:[filter];let n=0;const none=filter!=="all"&&!cnt(filter);
  $("main").innerHTML=(works.length&&!none)?show.map((c,i)=>`<section class="sec"><h2><span class="mono dim">${String(i+1).padStart(2,"0")}</span>${esc(c)}<span class="mono dim">${works.filter(w=>w.cat===c).length} work(s)</span></h2><div class="grid">${works.filter(w=>w.cat===c).map(w=>`<figure class="card" data-id="${w.id}"><button class="del mono" data-d="${w.id}">Delete ✕</button><img src="${w.src}" alt="${esc(w.title)}" loading="lazy"><span class="vw mono" aria-hidden="true">View +</span><figcaption class="cap mono"><span>${esc(w.title)}</span><span class="dim">[${String(++n).padStart(3,"0")}]</span></figcaption>${w.desc?`<div class="cdesc">${esc(w.desc)}</div>`:""}</figure>`).join("")}</div></section>`).join(""):`<div class="empty mono">${none?"No “"+esc(filter)+"” works yet<br><br>"+(CAN?"Press “+ Add work” and choose this type":"Check back soon"):"No works indexed yet<br><br>"+(CAN?"Press “+ Add work” to upload your first design":"Archive coming soon")}</div>`;
}

const pickType=e=>{const b=e.target.closest("[data-f]");if(!b)return;const f=b.dataset.f;
  if(f==="all"){tOpen=filter==="all"?!tOpen:true;filter="all"}else{filter=f;tOpen=false}
  render()};
$("bar").onclick=pickType;$("types").onclick=pickType;
$("main").onclick=e=>{
  const d=e.target.closest("[data-d]");
  if(d){if(!CAN)return;if(d.dataset.arm){const id=d.dataset.d;works=works.filter(w=>w.id!==id);DB.del(id);dirty=true;syncUI();render()}else{d.dataset.arm=1;d.textContent="Confirm?";d.classList.add("on");setTimeout(()=>{if(d.isConnected){delete d.dataset.arm;d.textContent="Delete ✕";d.classList.remove("on")}},2500)}return}
  const img=e.target.closest(".card img");
  if(img){const w=works.find(x=>x.id===img.closest(".card").dataset.id);if(w)openLB(w)}
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeLB();$("mAdd").classList.remove("open")}
  else if(lbOpen&&zoomApi){if(e.key==="+"||e.key==="=")zoomApi.zin();else if(e.key==="-"||e.key==="_")zoomApi.zout();else if(e.key==="0")zoomApi.reset();else if(e.key==="ArrowRight")zoomApi.next();else if(e.key==="ArrowLeft")zoomApi.prev()}
});

$("bMan").onclick=function(){document.body.classList.toggle("manage");const on=document.body.classList.contains("manage");this.classList.toggle("on",on);this.textContent=on?"Done":"Manage"};
$("bThm").onclick=()=>{const r=document.documentElement,l=r.dataset.theme==="light";l?r.removeAttribute("data-theme"):r.dataset.theme="light";try{localStorage.setItem("flux-theme",l?"dark":"light")}catch(e){}};

/* add flow */
$("cat").innerHTML=`<optgroup label="Style">${STYLES.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup><optgroup label="Format">${FORMATS.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup>`;
const setFiles=f=>{files=[...f].filter(x=>x.type.startsWith("image/"));$("dropT").textContent=files.length?files.length+" image(s) ready":"Drop images or click to browse"};
$("bAdd").onclick=()=>$("mAdd").classList.add("open");
$("xAdd").onclick=()=>{$("mAdd").classList.remove("open");setFiles([]);$("ttl").value="";$("desc").value=""};
$("file").onchange=e=>setFiles(e.target.files);

/* Flux Match mini-game */
(()=>{
  const P=[["Y2K","✦"],["Bauhaus","▲"],["Brutalist","■"],["Vaporwave","◐"],["Memphis","◆"],["Swiss","✚"],["Art Deco","◎"],["Grunge","✕"]];
  let first=null,lock=false,moves=0,found=0,t0=0,tm=null;
  const best=()=>{try{return +localStorage.getItem("flux-match-best")||0}catch(e){return 0}};
  const showBest=()=>{$("gB").textContent=best()?best()+" moves":"—"};
  const stop=()=>{clearInterval(tm);tm=null};
  function start(){
    stop();first=null;lock=false;moves=0;found=0;
    $("gM").textContent=0;$("gT").textContent="0s";$("gMsg").textContent="";showBest();
    const d=[...P,...P].map(x=>({n:x[0],g:x[1],r:Math.random()})).sort((a,b)=>a.r-b.r);
    $("gBoard").innerHTML=d.map(x=>`<button class="gc" data-k="${x.n}" aria-label="Card"><span class="g">${x.g}</span><span class="n">${x.n}</span></button>`).join("");
  }
  $("gBoard").onclick=e=>{
    const c=e.target.closest(".gc");
    if(!c||lock||c.classList.contains("up")||c.classList.contains("ok"))return;
    if(!tm){t0=Date.now();tm=setInterval(()=>{$("gT").textContent=Math.floor((Date.now()-t0)/1000)+"s"},500)}
    c.classList.add("up");
    if(!first){first=c;return}
    moves++;$("gM").textContent=moves;
    if(first.dataset.k===c.dataset.k){
      first.classList.replace("up","ok");c.classList.replace("up","ok");first=null;
      if(++found===P.length){
        stop();const secs=Math.floor((Date.now()-t0)/1000),b=best(),rec=!b||moves<b;
        if(rec){try{localStorage.setItem("flux-match-best",moves)}catch(e){}}
        $("gT").textContent=secs+"s";showBest();
        $("gMsg").textContent="Cleared in "+moves+" moves and "+secs+"s"+(rec?" — new best!":".")+" Press Restart to go again.";
      }
    }else{
      lock=true;const a=first;first=null;
      setTimeout(()=>{a.classList.remove("up");c.classList.remove("up");lock=false},800);
    }
  };
  $("gR").onclick=start;start();
})();

/* AMBIENT-START */
const AMB=(()=>{
  const F=m=>440*Math.pow(2,(m-69)/12);
  const CH=[{b:33,p:[57,64,67,71,72],a:[69,72,76,79,83]},{b:29,p:[53,57,60,64,67],a:[65,69,72,76,79]},{b:36,p:[60,64,67,71,74],a:[72,76,79,83,86]},{b:28,p:[59,64,67,71,74],a:[71,74,76,79,83]}];
  function make(ctx){
    const master=ctx.createGain();master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.02;comp.release.value=.4;
    master.connect(comp);comp.connect(ctx.destination);
    const len=Math.floor(ctx.sampleRate*3.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    const verb=ctx.createConvolver();verb.buffer=ir;const wet=ctx.createGain();wet.gain.value=.5;verb.connect(wet);wet.connect(master);
    const dry=ctx.createGain();dry.gain.value=.8;dry.connect(master);
    const del=ctx.createDelay(2);del.delayTime.value=.75;const fb=ctx.createGain();fb.gain.value=.38;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
    del.connect(lp);lp.connect(fb);fb.connect(del);
    const echo=ctx.createGain();echo.gain.value=.5;lp.connect(echo);echo.connect(verb);echo.connect(master);
    const padBus=ctx.createGain();padBus.connect(dry);padBus.connect(verb);
    const pluckBus=ctx.createGain();pluckBus.connect(dry);pluckBus.connect(verb);pluckBus.connect(del);
    const bassBus=ctx.createGain();bassBus.connect(master);
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
    const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=5000;
    const ag=ctx.createGain();ag.gain.value=.004;ns.connect(hp);hp.connect(ag);ag.connect(master);ns.start();
    return {ctx,master,padBus,pluckBus,bassBus};
  }
  function tone(c,bus,type,f,t,att,dur,rel,peak,det,flt){
    const x=c.ctx,o=x.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;
    const g=x.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setValueAtTime(peak,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+rel);
    let n=o;
    if(flt){const q=x.createBiquadFilter();q.type="lowpass";q.Q.value=.7;q.frequency.setValueAtTime(flt[0],t);q.frequency.linearRampToValueAtTime(flt[1],t+dur/2);q.frequency.linearRampToValueAtTime(flt[0],t+dur+rel);o.connect(q);n=q}
    n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+rel+.1);
  }
  function pluck(c,t,f,v){
    const x=c.ctx;
    [[f,1],[f*2,.25]].forEach(([fr,a])=>{
      const o=x.createOscillator();o.type="sine";o.frequency.value=fr;
      const g=x.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v*a*.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
      o.connect(g);g.connect(c.pluckBus);o.start(t);o.stop(t+1.7);
    });
  }
  function chord(c,t,i){
    const k=CH[i%CH.length];
    tone(c,c.bassBus,"sine",F(k.b),t,.4,8,2.5,.07);
    tone(c,c.bassBus,"triangle",F(k.b+12),t,.6,8,2.5,.03);
    k.p.forEach(m=>{tone(c,c.padBus,"sawtooth",F(m),t,2.5,8,3,.045,-8,[500,1100]);tone(c,c.padBus,"sawtooth",F(m),t,2.5,8,3,.045,8,[500,1100])});
    for(let s=0;s<16;s++)if(Math.random()<(s%4===0?.85:.45))pluck(c,t+s*.5+Math.random()*.03,F(k.a[Math.floor(Math.random()*k.a.length)]),.5+Math.random()*.5);
  }
  return {make,chord};
})();

/* Sound button: original generated ambient music, starts only when the visitor taps */
(()=>{
  let ctx=null,chain=null,on=false,nextT=0,idx=0,timer=null;
  const btn=$("snd"),lab=$("sndT");
  const fill=()=>{while(nextT<ctx.currentTime+14){AMB.chord(chain,nextT,idx++);nextT+=8}};
  function start(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();chain=AMB.make(ctx);nextT=ctx.currentTime+0.1}
    ctx.resume();const g=chain.master.gain,t=ctx.currentTime;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0.9,t+2.5);
    fill();clearInterval(timer);timer=setInterval(fill,1000);return true;
  }
  function stop(){
    const g=chain.master.gain,t=ctx.currentTime;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+1);
    clearInterval(timer);setTimeout(()=>{if(!on)ctx.suspend()},1100);
  }
  btn.onclick=()=>{
    if(!on){if(!start())return;on=true}else{on=false;stop()}
    btn.classList.toggle("live",on);btn.setAttribute("aria-pressed",on);lab.textContent=on?"Sound on":"Sound off";
  };
  document.addEventListener("visibilitychange",()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume()});
})();

/* Lightbox: zoom (wheel, pinch, buttons, keys, double-click), pan, and browse works (arrows, keys, swipe) */
let lbOpen=false,zoomApi=null;
function closeLB(){const lb=$("lb");lb.classList.remove("open");lb.innerHTML="";document.body.style.overflow="";lbOpen=false;zoomApi=null}
function openLB(w){
  const lb=$("lb"),ids=[...document.querySelectorAll(".card")].map(c=>c.dataset.id),many=ids.length>1;
  let k=Math.max(0,ids.indexOf(w.id));
  lb.innerHTML=`<div class="zbar mono"><span class="zt"></span><span class="zbtns"><span class="zc dim"></span><button data-z="out" aria-label="Zoom out">−</button><button data-z="lvl" aria-label="Reset zoom" title="Reset zoom">100%</button><button data-z="in" aria-label="Zoom in">+</button><button data-z="x" aria-label="Close">✕</button></span></div><div class="zstage"><img alt="" draggable="false"><button class="znav zprev" data-z="prev" aria-label="Previous work"${many?"":" hidden"}>‹</button><button class="znav znext" data-z="next" aria-label="Next work"${many?"":" hidden"}>›</button></div><div class="zd" hidden></div><div class="zhint mono dim">Scroll or pinch to zoom · drag to move${many?" · swipe or use ← → to browse":""}</div>`;
  lb.classList.add("open");document.body.style.overflow="hidden";lbOpen=true;
  const st=lb.querySelector(".zstage"),img=st.querySelector("img"),lvl=lb.querySelector('[data-z="lvl"]'),zt=lb.querySelector(".zt"),zc=lb.querySelector(".zc"),zd=lb.querySelector(".zd");
  let s=1,tx=0,ty=0,moved=false,lastTap=0,sx=0,sy=0,pd=0,pinched=false;const P=new Map();
  const maxS=()=>Math.max(3,Math.min(8,img.naturalWidth/(img.offsetWidth||1)*2));
  const apply=()=>{
    const mx=Math.max(0,(img.offsetWidth*s-st.clientWidth)/2),my=Math.max(0,(img.offsetHeight*s-st.clientHeight)/2);
    tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty));
    img.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")";lvl.textContent=Math.round(s*100)+"%";st.style.cursor=s>1?"grab":"zoom-in";
  };
  const zoomAt=(n,cx,cy)=>{n=Math.min(maxS(),Math.max(1,n));const q=n/s;tx=cx-(cx-tx)*q;ty=cy-(cy-ty)*q;s=n;apply()};
  const rel=(x,y)=>{const r=st.getBoundingClientRect();return [x-r.left-r.width/2,y-r.top-r.height/2]};
  function show(){
    const c=works.find(x=>x.id===ids[k]);if(!c)return;
    s=1;tx=0;ty=0;
    img.style.opacity=0;img.onload=()=>{img.style.opacity=1;apply()};img.alt=c.title;img.src=c.src;if(img.complete)img.style.opacity=1;
    zt.innerHTML=esc(c.title)+' — <span class="dim">'+esc(c.cat)+'</span>';
    zd.textContent=c.desc||"";zd.hidden=!c.desc;
    zc.textContent=many?(k+1)+" / "+ids.length:"";
    apply();
  }
  const go=d=>{if(!many)return;k=(k+d+ids.length)%ids.length;show()};
  zoomApi={zin:()=>zoomAt(s*1.4,0,0),zout:()=>zoomAt(s/1.4,0,0),reset:()=>{s=1;tx=0;ty=0;apply()},prev:()=>go(-1),next:()=>go(1)};
  lb.querySelectorAll(".znav").forEach(b=>b.addEventListener("pointerdown",e=>e.stopPropagation()));
  st.addEventListener("wheel",e=>{e.preventDefault();const dy=e.deltaMode===1?e.deltaY*16:e.deltaY,c=rel(e.clientX,e.clientY);zoomAt(s*Math.exp(-dy*(e.ctrlKey?0.01:0.0018)),c[0],c[1])},{passive:false});
  st.addEventListener("pointerdown",e=>{
    try{st.setPointerCapture(e.pointerId)}catch(_){}
    P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;sx=e.clientX;sy=e.clientY;
    if(P.size===1)pinched=false;
    if(P.size===2){pinched=true;const v=[...P.values()];pd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])}
  });
  st.addEventListener("pointermove",e=>{
    const prev=P.get(e.pointerId);if(!prev)return;P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===2){const v=[...P.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),c=rel((v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2);if(pd)zoomAt(s*d/pd,c[0],c[1]);pd=d;moved=true;return}
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>6)moved=true;
    if(s>1&&moved){tx+=e.clientX-prev[0];ty+=e.clientY-prev[1];apply();st.style.cursor="grabbing"}
  });
  const up=e=>{
    if(!P.has(e.pointerId))return;
    const solo=!pinched&&P.size===1;P.delete(e.pointerId);pd=0;st.style.cursor=s>1?"grab":"zoom-in";
    if(e.type!=="pointerup"||!solo)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(s===1&&many&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1);lastTap=0;return}
    if(!moved){
      const now=Date.now();
      if(now-lastTap<320){const c=rel(e.clientX,e.clientY);if(s>1)zoomAt(1,0,0);else zoomAt(2.5,c[0],c[1]);lastTap=0}else lastTap=now;
    }
  };
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  lb.onclick=e=>{
    const b=e.target.closest("[data-z]");
    if(b){const z=b.dataset.z;if(z==="in")zoomApi.zin();else if(z==="out")zoomApi.zout();else if(z==="lvl")zoomApi.reset();else if(z==="prev")go(-1);else if(z==="next")go(1);else closeLB();return}
    const r=img.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(!moved&&!inside&&!e.target.closest(".zbar,.zhint,.zd"))closeLB();
  };
  show();
}

/* 3D avatar: a low-poly head built from code and drawn with plain WebGL (no libraries). Drag to rotate. */
(()=>{
  const cv=$("av3d");if(!cv)return;

/* Gallery polish: cards fade in as they scroll into view, gentle tilt on hover (mouse only) */
(()=>{
  const main=$("main");
  const io="IntersectionObserver"in window?new IntersectionObserver(es=>{es.forEach(e=>{
    if(!e.isIntersecting)return;const c=e.target,d=(+c.dataset.k||0)*70;io.unobserve(c);
    c.style.transitionDelay=d+"ms";c.classList.add("in");setTimeout(()=>{c.style.transitionDelay=""},d+800);
  })},{threshold:.1,rootMargin:"0px 0px -4% 0px"}):null;
  const reveal=()=>{[...main.querySelectorAll(".card:not(.seen)")].forEach((c,i)=>{c.classList.add("seen");c.dataset.k=i%4;if(io)io.observe(c);else c.classList.add("in")})};
  new MutationObserver(reveal).observe(main,{childList:true});reveal();
  let cur=null;
  const rest=c=>{c.classList.remove("tilt");c.style.removeProperty("--rx");c.style.removeProperty("--ry")};
  main.addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse")return;
    const c=e.target.closest?e.target.closest(".card"):null;
    if(cur&&cur!==c){rest(cur);cur=null}
    if(!c)return;cur=c;
    const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    c.classList.add("tilt");c.style.setProperty("--rx",(-py*6).toFixed(2)+"deg");c.style.setProperty("--ry",(px*6).toFixed(2)+"deg");
  });
  main.addEventListener("pointerleave",()=>{if(cur){rest(cur);cur=null}});
  main.addEventListener("click",()=>{if(cur){rest(cur);cur=null}});
})();

})();

  return "<!DOCTYPE html>\n<html lang=\"en\"><head>"+HEAD+"</head><body><script>"+main.toString()+"\nmain("+json+")<\/script></body></html>";
