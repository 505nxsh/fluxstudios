<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

</head><body><script>function main(SEED){
const CSS=`
:root{--bg:#000;--fg:#fff;--dim:#8c8c8c;--line:#262626;--card:#0b0b0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--fg:#000;--dim:#666;--line:#d6d6d6;--card:#f3f3f3}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);opacity:.7}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.dim{color:var(--dim)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--fg);cursor:pointer;padding:.55rem .9rem;transition:.18s}
button:hover,button.on{background:var(--fg);color:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.9rem clamp(1rem,4vw,3rem);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.8rem}
.logo{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1.25rem;border:1px solid var(--fg);padding:.25rem .6rem;letter-spacing:-.03em}
.nav{display:flex;gap:.5rem;flex-wrap:wrap}
.hero{position:relative;padding:clamp(3rem,10vw,7rem) clamp(1rem,4vw,3rem) 2.5rem;overflow:hidden}
.hero h1{font-size:clamp(3.2rem,14vw,10rem);line-height:.88;letter-spacing:-.05em;font-weight:700;margin:1rem 0 1.5rem}
.hero h1 span{color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.hero h1 i{font-style:normal;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hero p.lead{max-width:34rem;color:var(--dim);font-size:1.05rem;line-height:1.5}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fg),transparent);opacity:.35;animation:sc 5s linear infinite}
@keyframes sc{from{top:-5%}to{top:105%}}
.stats{display:flex;gap:2.5rem;margin-top:2rem;flex-wrap:wrap}
.stats b{display:block;font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:600}
.tick{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:.7rem 0}
.tick div{display:inline-block;animation:tk 90s linear infinite;color:var(--dim)}
@keyframes tk{to{transform:translateX(-50%)}}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;padding:1.5rem clamp(1rem,4vw,3rem)}
.chip{padding:.35rem .7rem;font-size:.7rem;border-color:var(--line)}
.chip:hover,.chip.on{border-color:var(--fg)}
main{padding:0 clamp(1rem,4vw,3rem) 4rem}
.sec{margin-top:2.5rem}
.sec h2{display:flex;align-items:baseline;gap:1rem;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:-.03em;border-bottom:1px solid var(--fg);padding-bottom:.6rem;margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:1.1rem}
.card{position:relative;background:var(--card);border:1px solid var(--line);animation:in .5s both;transition:.2s}
.card:hover{border-color:var(--fg);transform:translateY(-3px)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--fg);z-index:2;pointer-events:none;opacity:0;transition:.2s}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card:hover::before,.card:hover::after{opacity:1}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:var(--line)}
.cap{display:flex;justify-content:space-between;gap:.6rem;padding:.7rem .8rem;border-top:1px solid var(--line)}
.cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{display:none;position:absolute;top:.5rem;right:.5rem;z-index:3;background:var(--bg);font-size:.65rem;padding:.35rem .6rem}
.manage .del{display:block}
[hidden]{display:none!important}
.own-only{display:none}.own .own-only{display:inline-block}
.empty{border:1px dashed var(--dim);padding:4rem 1rem;text-align:center;margin-top:2rem;color:var(--dim)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.open{display:flex}
.box{width:min(100%,460px);max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--fg);padding:1.4rem;display:grid;gap:.9rem}
.box h3{font-size:1.4rem;letter-spacing:-.03em}
.drop{display:block;border:1px dashed var(--fg);padding:2rem 1rem;text-align:center;cursor:pointer}
.drop.hot,.drop:hover{background:var(--card)}
.drop input{display:none}
input[type=text],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:.65rem}
input[type=text]:focus,select:focus{outline:none;border-color:var(--fg)}
.row{display:flex;gap:.6rem;justify-content:flex-end}
#lb img{max-width:100%;max-height:82vh;border:1px solid var(--fg)}
#lb{flex-direction:column;gap:.8rem;cursor:zoom-out}
footer{border-top:1px solid var(--line);padding:1.5rem clamp(1rem,4vw,3rem);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
`,BODY=`
<header>
  <div class="brand"><div class="logo">f(x)</div><div class="mono">Flux Studios</div></div>
  <div class="nav mono">
    <span id="meter" class="own-only dim" style="align-self:center;padding-right:.4rem"></span>
    <button id="bPub" class="on own-only" hidden>Publish changes</button>
    <button id="bAdd" class="own-only">+ Add work</button>
    <button id="bMan" class="own-only">Manage</button>
    <button id="bThm">Invert</button>
  </div>
</header>

<section class="hero">
  <div class="scan"></div>
  <div class="mono dim">// Design archive — indexed by type</div>
  <h1>Flux<br><span>Studios</span><i>_</i></h1>
  <p class="lead">A living archive of every design I've made — from Y2K chrome to stripped-back minimalism. f(x) = design.</p>
  <div class="stats">
    <div><b id="sW">0</b><span class="mono dim">Works</span></div>
    <div><b id="sT">0</b><span class="mono dim">Types in use</span></div>
    <div><b id="sA">0</b><span class="mono dim">Types available</span></div>
  </div>
</section>

<div class="tick mono"><div id="tk"></div></div>
<div class="bar mono" id="bar"></div>
<main id="main"></main>

<footer class="mono dim"><span>© Flux Studios</span><span>f(x) = design</span></footer>

<div class="modal" id="mAdd">
  <div class="box">
    <h3>Add to archive</h3>
    <label class="drop mono" id="drop"><span id="dropT">Drop images or click to browse</span><input type="file" id="file" accept="image/*" multiple></label>
    <input type="text" id="ttl" placeholder="Title (optional)" maxlength="80">
    <select id="cat"></select>
    <div class="row mono"><button id="xAdd">Cancel</button><button id="okAdd" class="on">Add</button></div>
  </div>
</div>
<div class="modal" id="lb"></div>

`,HEAD=`
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Studios — f(x)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='3' y='3' width='58' height='58' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Courier New,monospace' font-weight='700' font-size='25' fill='%23fff' text-anchor='middle' textLength='44' lengthAdjust='spacingAndGlyphs'%3Ef(x)%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

`;
const st=document.createElement('style');st.textContent=CSS;document.head.append(st);
document.body.insertAdjacentHTML('afterbegin',BODY);
const STYLES="Y2K,Minimalist,Brutalist,Neo-Brutalist,Swiss / International,Bauhaus,Art Deco,Art Nouveau,Vaporwave,Retro / Vintage,Retro-Futurism,Cyberpunk,Futurism,Memphis,Psychedelic,Grunge,Maximalist,Flat,Skeuomorphic,Glassmorphism,Neumorphism,Gradient,Acid Graphics,Pop Art,Constructivist,Dada,Surrealist,Modernist,Postmodern,Abstract,Geometric,Isometric,Low Poly,Pixel Art,Line Art,Hand-Drawn,Collage,Duotone,Gothic,Steampunk,Cottagecore,Kawaii,Anime / Manga,Cartoon,Vector,3D / CGI,Photo Manipulation,Mixed Media,Typographic,Organic / Botanical".split(",");
const FORMATS="Logo & Branding,Poster,Packaging,Editorial / Magazine,Album Cover,Social Media,UI / UX,Web Design,Infographic,Merch / Apparel,Signage,Motion Graphics,Illustration,Photo Edit,Other".split(",");
const ALL=[...STYLES,...FORMATS];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let works=[],filter="all",files=[],CAN=false,A=null,dirty=false;
works=(SEED||[]).sort((a,b)=>b.ts-a.ts);

/* storage: IndexedDB (falls back to memory) */
const DB={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open("flux-studios",1);q.onupgradeneeded=()=>q.result.createObjectStore("w",{keyPath:"id"});q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 all(){return new Promise(r=>{if(!this.db)return r([]);try{const q=this.db.transaction("w").objectStore("w").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})},
 put(o){try{this.db&&this.db.transaction("w","readwrite").objectStore("w").put(o)}catch(e){}},
 del(id){try{this.db&&this.db.transaction("w","readwrite").objectStore("w").delete(id)}catch(e){}}};

function shrink(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/webp",.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}

function recode(src,sc,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/webp",q))};im.onerror=rej;im.src=src})}
function render(){
  if(filter!=="all"&&!works.some(w=>w.cat===filter))filter="all";
  const used=ALL.filter(c=>works.some(w=>w.cat===c));
  $("sW").textContent=works.length;$("sT").textContent=used.length;$("sA").textContent=ALL.length;
  $("bar").innerHTML=works.length?`<button class="chip ${filter==="all"?"on":""}" data-f="all">All (${works.length})</button>`+used.map(c=>`<button class="chip ${filter===c?"on":""}" data-f="${esc(c)}">${esc(c)} (${works.filter(w=>w.cat===c).length})</button>`).join(""):"";
  const show=filter==="all"?used:[filter];let n=0;
  $("main").innerHTML=works.length?show.map((c,i)=>`<section class="sec"><h2><span class="mono dim">${String(i+1).padStart(2,"0")}</span>${esc(c)}<span class="mono dim">${works.filter(w=>w.cat===c).length} work(s)</span></h2><div class="grid">${works.filter(w=>w.cat===c).map(w=>`<figure class="card" data-id="${w.id}"><button class="del mono" data-d="${w.id}">Delete ✕</button><img src="${w.src}" alt="${esc(w.title)}" loading="lazy"><figcaption class="cap mono"><span>${esc(w.title)}</span><span class="dim">[${String(++n).padStart(3,"0")}]</span></figcaption></figure>`).join("")}</div></section>`).join(""):`<div class="empty mono">No works indexed yet<br><br>${CAN?"Press “+ Add work” to upload your first design":"Archive coming soon"}</div>`;
}

$("bar").onclick=e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}};
$("main").onclick=e=>{
  const d=e.target.closest("[data-d]");
  if(d){if(!CAN)return;if(d.dataset.arm){const id=d.dataset.d;works=works.filter(w=>w.id!==id);DB.del(id);dirty=true;syncUI();render()}else{d.dataset.arm=1;d.textContent="Confirm?";d.classList.add("on");setTimeout(()=>{if(d.isConnected){delete d.dataset.arm;d.textContent="Delete ✕";d.classList.remove("on")}},2500)}return}
  const img=e.target.closest(".card img");
  if(img){const w=works.find(x=>x.id===img.closest(".card").dataset.id);$("lb").innerHTML=`<img src="${w.src}" alt=""><div class="mono">${esc(w.title)} — <span class="dim">${esc(w.cat)}</span></div>`;$("lb").classList.add("open")}
};
$("lb").onclick=()=>$("lb").classList.remove("open");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("lb").classList.remove("open");$("mAdd").classList.remove("open")}});

$("bMan").onclick=function(){document.body.classList.toggle("manage");const on=document.body.classList.contains("manage");this.classList.toggle("on",on);this.textContent=on?"Done":"Manage"};
$("bThm").onclick=()=>{const r=document.documentElement,l=r.dataset.theme==="light";l?r.removeAttribute("data-theme"):r.dataset.theme="light";try{localStorage.setItem("flux-theme",l?"dark":"light")}catch(e){}};

/* add flow */
$("cat").innerHTML=`<optgroup label="Style">${STYLES.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup><optgroup label="Format">${FORMATS.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup>`;
const setFiles=f=>{files=[...f].filter(x=>x.type.startsWith("image/"));$("dropT").textContent=files.length?files.length+" image(s) ready":"Drop images or click to browse"};
$("bAdd").onclick=()=>$("mAdd").classList.add("open");
$("xAdd").onclick=()=>{$("mAdd").classList.remove("open");setFiles([]);$("ttl").value=""};
$("file").onchange=e=>setFiles(e.target.files);
const dr=$("drop");
["dragover","dragenter"].forEach(t=>dr.addEventListener(t,e=>{e.preventDefault();dr.classList.add("hot")}));
["dragleave","drop"].forEach(t=>dr.addEventListener(t,e=>{e.preventDefault();dr.classList.remove("hot")}));
dr.addEventListener("drop",e=>setFiles(e.dataTransfer.files));
$("okAdd").onclick=async()=>{
  if(!files.length){$("dropT").textContent="Choose at least one image first";return}
  $("okAdd").textContent="Adding…";
  for(const f of files){try{
    const w={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:(files.length===1&&$("ttl").value.trim())||f.name.replace(/\.[^.]+$/,""),cat:$("cat").value,src:await shrink(f),ts:Date.now()};
    works.unshift(w);DB.put(w);dirty=true}catch(e){}}
  $("okAdd").textContent="Add";$("xAdd").onclick();syncUI();render();
};

/* init */
$("tk").textContent=(ALL.join("  /  ")+"  /  ").repeat(2);
try{if(localStorage.getItem("flux-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}
render();
function syncUI(){$("bPub").hidden=!dirty;$("meter").textContent=(works.reduce((n,w)=>n+w.src.length,0)/1e6).toFixed(1)+" / 15 MB"}
/* owner mode: only the page owner gets edit controls; visitors see a read-only gallery */
(async()=>{try{
  if(!(window.claude&&claude.use))return;
  const [a,u]=await Promise.all([claude.use("artifact"),claude.use("user")]);
  if(!a||!u||!(await u.canEdit()))return;
  A=a;CAN=true;document.body.classList.add("own");
  await DB.open();
  const ids=new Set(works.map(w=>w.id)),fresh=(await DB.all()).filter(w=>!ids.has(w.id));
  if(fresh.length){works=[...fresh,...works].sort((a,b)=>b.ts-a.ts);dirty=true}
  syncUI();render();
}catch(e){}})();
$("bPub").onclick=async()=>{
  if(!A||!dirty)return;const b=$("bPub");b.textContent="Publishing…";
  try{
    const build=()=>buildDoc(works);
    let html=build(),q=.82,pass=0;
    while(html.length>15e6&&pass<5){pass++;q=Math.max(.5,q-.07);b.textContent="Optimizing "+pass+"/5…";for(const w of works)w.src=await recode(w.src,.85,q);html=build()}
    if(html.length>15e6){b.textContent="Archive too large";return}
    await A.publish(html);dirty=false;
  }catch(e){b.textContent="Publish failed — retry"}
};

function buildDoc(list){
  const json=JSON.stringify(list.map(({id,title,cat,src,ts})=>({id,title,cat,src,ts}))).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\"><head>"+HEAD+"</head><body><script>"+main.toString()+"\nmain("+json+")<\/script></body></html>";
