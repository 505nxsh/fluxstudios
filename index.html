/* admin mode: add #admin to the end of the site address */
(async()=>{try{
  if(location.hash!=="#admin")return;
  CAN=true;document.body.classList.add("own");
  await DB.open();
  const loc=await DB.all(),gone=new Set(loc.filter(x=>x.del).map(x=>x.id)),n0=works.length;
  works=works.filter(w=>!gone.has(w.id));
  const ids=new Set(works.map(w=>w.id)),fresh=loc.filter(x=>!x.del&&!ids.has(x.id));
  works=[...fresh,...works].sort((a,b)=>b.ts-a.ts);
  if(fresh.length||works.length-fresh.length<n0)dirty=true;
  syncUI();render();
}catch(e){}})();

  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dirty=false;syncUI();
};

/* Flux Match mini-game */
(()=>{
  const P=[["Y2K","✦"],["Bauhaus","▲"],["Brutalist","■"],["Vaporwave","◐"],["Memphis","◆"],["Swiss","✚"],["Art Deco","◎"],["Grunge","✕"]];
  let first=null,lock=false,moves=0,found=0,t0=0,tm=null;
  const best=()=>{try{return +localStorage.getItem("flux-match-best")||0}catch(e){return 0}};
  const showBest=()=>{$("gB").textContent=best()?best()+" moves":"—"};
  const stop=()=>{clearInterval(tm);tm=null};
  function start(){
    stop();first=null;lock=false;moves=0;found=0;
    $("gM").textContent=0;$("gT").textContent="0s";$("gMsg").textContent="";showBest();
    const d=[...P,...P].map(x=>({n:x[0],g:x[1],r:Math.random()})).sort((a,b)=>a.r-b.r);
    $("gBoard").innerHTML=d.map(x=>`<button class="gc" data-k="${x.n}" aria-label="Card"><span class="g">${x.g}</span><span class="n">${x.n}</span></button>`).join("");
  }
  $("gBoard").onclick=e=>{
    const c=e.target.closest(".gc");
    if(!c||lock||c.classList.contains("up")||c.classList.contains("ok"))return;
    if(!tm){t0=Date.now();tm=setInterval(()=>{$("gT").textContent=Math.floor((Date.now()-t0)/1000)+"s"},500)}
    c.classList.add("up");
    if(!first){first=c;return}
    moves++;$("gM").textContent=moves;
    if(first.dataset.k===c.dataset.k){
      first.classList.replace("up","ok");c.classList.replace("up","ok");first=null;
      if(++found===P.length){
        stop();const secs=Math.floor((Date.now()-t0)/1000),b=best(),rec=!b||moves<b;
        if(rec){try{localStorage.setItem("flux-match-best",moves)}catch(e){}}
        $("gT").textContent=secs+"s";showBest();
        $("gMsg").textContent="Cleared in "+moves+" moves and "+secs+"s"+(rec?" — new best!":".")+" Press Restart to go again.";
      }
    }else{
      lock=true;const a=first;first=null;
      setTimeout(()=>{a.classList.remove("up");c.classList.remove("up");lock=false},800);
    }
  };
  $("gR").onclick=start;start();
})();

/* Design quote generator */
(()=>{
  const Q=[
["Design is thinking made visual.","Saul Bass"],
["Good design is as little design as possible.","Dieter Rams"],
["Less, but better.","Dieter Rams"],
["Design is not just what it looks like and feels like. Design is how it works.","Steve Jobs"],
["The details are not the details. They make the design.","Charles Eames"],
["To design is to communicate clearly by whatever means you can control or master.","Milton Glaser"],
["There are three responses to a piece of design: yes, no, and WOW! Wow is the one to aim for.","Milton Glaser"],
["Graphic design will save the world right after rock and roll does.","David Carson"],
["Typography is what language looks like.","Ellen Lupton"],
["Typography is the craft of endowing human language with a durable visual form.","Robert Bringhurst"],
["Good design is obvious. Great design is transparent.","Joe Sparano"],
["Design is intelligence made visible.","Alina Wheeler"],
["The ability to simplify means to eliminate the unnecessary so that the necessary may speak.","Hans Hofmann"],
["Less is more.","Ludwig Mies van der Rohe"],
["Form follows function.","Louis Sullivan"],
["Color is a power which directly influences the soul.","Wassily Kandinsky"],
["Design is so simple, that’s why it is so complicated.","Paul Rand"],
["A logo doesn’t sell, it identifies.","Paul Rand"],
["Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.","Antoine de Saint-Exupéry"],
["I strive for two things in design: simplicity and clarity. Great design is born of those two things.","Lindon Leader"],
["Whitespace is like air: it is necessary for design to breathe.","Wojciech Zieliński"]];
  let cur=-1,busy=false;
  const body=document.querySelector("#quote .qbody");
  const pick=()=>{let i;do{i=Math.floor(Math.random()*Q.length)}while(i===cur);return i};
  const set=i=>{cur=i;$("qT").textContent="“"+Q[i][0]+"”";$("qA").textContent="— "+Q[i][1];$("qN").textContent="No. "+String(i+1).padStart(2,"0")+" / "+Q.length};
  $("quote").onclick=()=>{
    if(busy)return;busy=true;body.classList.add("out");
    setTimeout(()=>{set(pick());body.classList.remove("out");busy=false},250);
  };
  set(pick());
})();

/* intro: title letter by letter, then the tagline word by word */
(()=>{
  const h=document.querySelector(".hero h1"),lead=document.querySelector(".hero .lead"),eb=document.querySelector(".hero > .mono"),st=document.querySelector(".hero .stats"),cur=h.querySelector("i");
  let n=0;
  const letters=el=>[...el.childNodes].forEach(nd=>{
    if(nd.nodeType===3){
      const f=document.createDocumentFragment();
      [...nd.textContent].forEach(c=>{const e=document.createElement("em");e.className="ch";e.setAttribute("aria-hidden","true");e.textContent=c;e.style.setProperty("--d",(0.35+n++*0.07)+"s");f.append(e)});
      nd.replaceWith(f);
    }else if(nd.tagName==="SPAN")letters(nd);
  });
  h.setAttribute("aria-label","Flux Studios");letters(h);
  const t1=0.35+n*0.07+0.25,words=lead.textContent.trim().split(/\s+/);
  lead.textContent="";
  words.forEach((w,i)=>{const e=document.createElement("em");e.className="wd";e.textContent=w;e.style.setProperty("--d",(t1+i*0.05)+"s");lead.append(e);if(i<words.length-1)lead.append(" ")});
  const t2=t1+words.length*0.05+0.35;
  eb.style.setProperty("--d","0.05s");eb.classList.add("fade");
  st.style.setProperty("--d",t2+"s");st.classList.add("fade");
  $("go").style.setProperty("--d",(t2+0.3)+"s");$("snd").style.setProperty("--d",(t2+0.3)+"s");
  cur.style.visibility="hidden";setTimeout(()=>{cur.style.visibility="visible"},(0.35+n*0.07+0.4)*1000);
})();

  const go=$("go"),arr=$("goA"),root=document.documentElement;

})();

const AMB=(()=>{
  const F=m=>440*Math.pow(2,(m-69)/12);
  const CH=[{b:33,p:[57,64,67,71,72],a:[69,72,76,79,83]},{b:29,p:[53,57,60,64,67],a:[65,69,72,76,79]},{b:36,p:[60,64,67,71,74],a:[72,76,79,83,86]},{b:28,p:[59,64,67,71,74],a:[71,74,76,79,83]}];
  function make(ctx){
    const master=ctx.createGain();master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.02;comp.release.value=.4;
    master.connect(comp);comp.connect(ctx.destination);
    const len=Math.floor(ctx.sampleRate*3.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    const verb=ctx.createConvolver();verb.buffer=ir;const wet=ctx.createGain();wet.gain.value=.5;verb.connect(wet);wet.connect(master);
    const dry=ctx.createGain();dry.gain.value=.8;dry.connect(master);
    const del=ctx.createDelay(2);del.delayTime.value=.75;const fb=ctx.createGain();fb.gain.value=.38;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
    del.connect(lp);lp.connect(fb);fb.connect(del);
    const echo=ctx.createGain();echo.gain.value=.5;lp.connect(echo);echo.connect(verb);echo.connect(master);
    const padBus=ctx.createGain();padBus.connect(dry);padBus.connect(verb);
    const pluckBus=ctx.createGain();pluckBus.connect(dry);pluckBus.connect(verb);pluckBus.connect(del);
    const bassBus=ctx.createGain();bassBus.connect(master);
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
    const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=5000;
    const ag=ctx.createGain();ag.gain.value=.004;ns.connect(hp);hp.connect(ag);ag.connect(master);ns.start();
    return {ctx,master,padBus,pluckBus,bassBus};
  }
  function tone(c,bus,type,f,t,att,dur,rel,peak,det,flt){
    const x=c.ctx,o=x.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;
    const g=x.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setValueAtTime(peak,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+rel);
    let n=o;
    if(flt){const q=x.createBiquadFilter();q.type="lowpass";q.Q.value=.7;q.frequency.setValueAtTime(flt[0],t);q.frequency.linearRampToValueAtTime(flt[1],t+dur/2);q.frequency.linearRampToValueAtTime(flt[0],t+dur+rel);o.connect(q);n=q}
    n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+rel+.1);
  }
  function pluck(c,t,f,v){
    const x=c.ctx;
    [[f,1],[f*2,.25]].forEach(([fr,a])=>{
      const o=x.createOscillator();o.type="sine";o.frequency.value=fr;
      const g=x.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v*a*.09,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
      o.connect(g);g.connect(c.pluckBus);o.start(t);o.stop(t+1.7);
    });
  }
  function chord(c,t,i){
    const k=CH[i%CH.length];
    tone(c,c.bassBus,"sine",F(k.b),t,.4,8,2.5,.24);
    tone(c,c.bassBus,"triangle",F(k.b+12),t,.6,8,2.5,.05);
    k.p.forEach(m=>{tone(c,c.padBus,"sawtooth",F(m),t,2.5,8,3,.03,-8,[500,1100]);tone(c,c.padBus,"sawtooth",F(m),t,2.5,8,3,.03,8,[500,1100])});
    for(let s=0;s<16;s++)if(Math.random()<(s%4===0?.85:.45))pluck(c,t+s*.5+Math.random()*.03,F(k.a[Math.floor(Math.random()*k.a.length)]),.5+Math.random()*.5);
  }
  return {make,chord};
})();

/* Sound button: original generated ambient music, starts only when the visitor taps */
(()=>{
  let ctx=null,chain=null,on=false,nextT=0,idx=0,timer=null;
  const btn=$("snd"),lab=$("sndT");
  const fill=()=>{while(nextT<ctx.currentTime+14){AMB.chord(chain,nextT,idx++);nextT+=8}};
  function start(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();chain=AMB.make(ctx);nextT=ctx.currentTime+0.1}
    ctx.resume();const g=chain.master.gain,t=ctx.currentTime;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0.6,t+2.5);
    fill();clearInterval(timer);timer=setInterval(fill,1000);return true;
  }
  function stop(){
    const g=chain.master.gain,t=ctx.currentTime;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+1);
    clearInterval(timer);setTimeout(()=>{if(!on)ctx.suspend()},1100);
  }
  btn.onclick=()=>{
    if(!on){if(!start())return;on=true}else{on=false;stop()}
    btn.classList.toggle("live",on);btn.setAttribute("aria-pressed",on);lab.textContent=on?"Sound on":"Sound off";
  };
  document.addEventListener("visibilitychange",()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume()});
})();

function buildDoc(list){

  return "<!DOCTYPE html>\n<html lang=\"en\"><head>"+HEAD+"</head><body><script>"+main.toString()+"\nmain("+json+")<\/script></body></html>";
}
